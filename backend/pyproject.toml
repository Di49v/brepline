[project]
name = "brepline-backend"
version = "2.0.0"
description = "Text-to-CAD generation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.1",
    "openai>=1.30.0",
    "supabase>=2.4.3",
    "cadquery>=2.4",
    "numpy",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
